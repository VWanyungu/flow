image: docker:29.1  # Updated to current version with modern CLI

services:
  - docker:29.1-dind  # Matching DinD version

variables:
  DOCKER_TLS_CERTDIR: "/certs"  # Required for DinD security

stages:
  - build

build-and-push:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /^Merge/'  # Triggers only on merges to main
      when: on_success
  script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD  # Authenticate with GitLab registry
    - docker compose build
    - docker compose push
