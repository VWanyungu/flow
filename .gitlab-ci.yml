image: docker:stable  # Base image for the job (provides Docker CLI)

services:
  - docker:dind  # Enables Docker-in-Docker to build images inside the pipeline

variables:
  DOCKER_TLS_CERTDIR: "/certs"  # Required for dind security

stages:
  - build

build-and-push:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /^Merge/'  # Triggers only on merges to main
      when: on_success
  script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD  # Authenticate with GitLab registry
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .  # Build and tag the image (e.g., :main)
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG  # Push to registry
